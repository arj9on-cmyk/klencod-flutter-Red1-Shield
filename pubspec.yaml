name: red_shield
description: Red1 Shield - Protection System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6
  url_launcher: ^6.2.4
  device_info_plus: ^10.1.0
  crypto: ^3.0.3
  video_player: ^2.8.6     # ✅ أضفنا مكتبة الفيديو

dev_dependencies:

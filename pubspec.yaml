    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  obfuscate: true          # ✅ سطر التشفير (ممتاز)
  assets:                  # ✅ ربط مجلد الفيديوهات
    - assets/bg_video.mp4
    - assets/bg_video2.mp4